# A drop-in for the alloy package's unit on the pool host, as /etc/systemd/system/alloy.service.d/alloy.conf:
# hands Alloy the Grafana Cloud stack's URL, user, and push token from a file only root reads, and restarts it
# if it stops (deploy/config.alloy).
[Service]
EnvironmentFile=/etc/alloy/grafana-cloud.env
Restart=always
RestartSec=5
