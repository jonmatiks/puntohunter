<header>
  <a class="brand" href="/"><img src="/logo.png" alt="" width="32" height="32">{{name}}</a>
  <nav>
    <a href="/">Main</a>
    <!-- Shown when this browser saved a fleet; the pool never names one. -->
    <a id="my-fleet" href="/fleet.html" hidden>My fleet</a>
    <a href="/balance.html">Balance</a>
    <a href="/stats.html">Stats</a>
    <a href="/blocks.html">Blocks</a>
<!--#include nav-extra.html -->
  </nav>
  <!-- Dark, then light, then auto, which follows the system. common.js shows the icon of the current one. -->
  <button type="button" class="link" id="theme" hidden>
    <svg data-theme-icon="dark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <svg data-theme-icon="light" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg data-theme-icon="auto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>
