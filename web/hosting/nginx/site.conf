# nginx's site for the files build.py writes: copy dist/ to the root below, and include this file from the
# http block of nginx.conf. Change server_name, root, and the certificate paths to your own.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pool.example.com;

    ssl_certificate     /etc/letsencrypt/live/pool.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.example.com/privkey.pem;

    root /var/www/portal;
    index index.html;
    error_page 404 /404.html;

    # What a page's meta tags cannot carry; each page's own Content-Security-Policy covers the rest, and the
    # browser enforces both. no-cache keeps files cached but checks them on each load, so a page never runs
    # beside a script from an earlier deploy.
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: the pool's API on this site's own origin, for a pool on the same host, with site.json's api left
    # empty. Leave it out when the site calls the pool's own HTTPS origin. The pool must trust this proxy's
    # X-Forwarded-For ([portal] trusted_proxy = "127.0.0.1") for its limits to key on each viewer.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The live streams: each event passes on as it arrives, and an idle stream stays open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pool.example.com;
    return 301 https://$host$request_uri;
}
