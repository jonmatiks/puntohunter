name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/references.py
        env:
          REFERENCES_DENY: ${{ secrets.REFERENCES_DENY }}

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      # The SRI interop images take minutes to build; build them before pytest's per-test timeouts start.
      - run: docker compose -f tests/e2e/docker-compose.sri.yml build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r tests/e2e/requirements.txt
      - run: pytest tests/e2e -m "not load and not hardware" -n 2
