[pytest]
# pytest-timeout bounds every test.
timeout = 120
# The default run leaves the load and hardware runs out; `-m load` or `-m hardware` on the
# command line selects one instead.
addopts = --strict-markers -m "not load and not hardware"
markers =
    load: 1,000-worker load runs, excluded from the default run
    hardware: runs against a physical Bitaxe, excluded from the default run
